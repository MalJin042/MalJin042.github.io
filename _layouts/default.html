<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Projects</h2>
            <button class="sidebar-close">&times;</button>
        </div>
        <nav class="sidebar-nav">
            <a href="{{ '/' | relative_url }}" class="sidebar-project sidebar-home">
                <span class="project-title">Home</span>
            </a>
            {% assign sorted_projects = site.projects | sort: 'order' %}
            {% for project in sorted_projects %}
            <a href="{{ project.url | relative_url }}" class="sidebar-project">
                <span class="project-number">{{ forloop.index }}</span>
                <span class="project-title">{{ project.title }}</span>
            </a>
            {% endfor %}
        </nav>
    </div>

    <div class="overlay"></div>

    <header>
        <button class="menu-toggle">☰</button>
        <a href="{{ '/' | relative_url }}" class="site-title-link">
            <h1 class="site-title">{{ site.title }}</h1>
        </a>
        <nav class="header-links">
            <a href="https://www.linkedin.com/in/zhen-jin-0b434194/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
            <a href="mailto:mal.jin042@gmail.com">Email</a>
        </nav>
    </header>

    <main>
        {{ content }}
    </main>

    <footer>
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.title }}</p>
    </footer>

    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const sidebar = document.querySelector('.sidebar');
        const overlay = document.querySelector('.overlay');
        const sidebarClose = document.querySelector('.sidebar-close');

        function openSidebar() {
            sidebar.classList.add('active');
            overlay.classList.add('active');
        }

        function closeSidebar() {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
        }

        menuToggle.addEventListener('click', openSidebar);
        sidebarClose.addEventListener('click', closeSidebar);
        overlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
