---
layout: default
---

<article class="project-detail">
    <header class="project-header">
        <h1>{{ page.title }}</h1>
        <p class="project-description">{{ page.description }}</p>
    </header>

    {% if page.pdf %}
    <section class="project-pdf">
        <iframe src="{{ page.pdf | relative_url }}" width="100%" height="800px" frameborder="0"></iframe>
    </section>
    {% endif %}

    <div class="project-content">
        {{ content }}
    </div>
</article>
